
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Information Portal</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; }
header, footer { background: #174a73; color: white; text-align: center; padding: 20px; }
nav { display: flex; justify-content: center; background: #222; flex-wrap: wrap; }
nav a { color: white; text-decoration: none; padding: 14px 20px; }
nav a:hover { background: #3677a4; }
main { max-width: 1000px; margin: auto; padding: 20px; }
section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 500px; }
th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
th { background: #174a73; color: white; }
tbody tr:nth-child(even) { background: #edf3f8; }
form { display: grid; gap: 10px; max-width: 500px; }
input, select, button { padding: 10px; width: 100%; font-size: 16px; }
button { background: #176b45; color: white; border: none; cursor: pointer; }
@media(max-width:600px) {
nav { flex-direction: column; text-align: center; }
main { padding: 10px; }
}
</style>
</head>
<body>
<header><h1>Student Information Portal</h1></header>
<nav>
<a href="#home">Home</a>
<a href="#students">Students</a>
<a href="#register">Registration</a>
</nav>
<main id="home">
<section id="students">
<h2>Student Table</h2>
<div class="table-wrap">
<table>
<thead>
<tr><th>Roll No.</th><th>Name</th><th>Department</th><th>Year</th></tr>
</thead>
<tbody id="studentRows">
<tr><td>101</td><td>Rahul Patil</td><td>Computer</td><td>Second</td></tr>
<tr><td>102</td><td>Amit Sharma</td><td>IT</td><td>Second</td></tr>
<tr><td>103</td><td>Priya Deshmukh</td><td>Computer</td><td>First</td></tr>
</tbody>
</table>
</div>
</section>
<section id="register">
<h2>Student Registration Form</h2>
<form id="registrationForm">
<label for="name">Full Name</label>
<input id="name" type="text" required>
<label for="roll">Roll Number</label>
<input id="roll" type="text" required>
<label for="email">Email</label>
<input id="email" type="email" required>
<label for="department">Department</label>
<select id="department" required>
<option value="">Select Department</option>
<option>Computer Engineering</option>
<option>Information Technology</option>
<option>Mechanical Engineering</option>
</select>
<label for="year">Year</label>
<select id="year" required>
<option value="">Select Year</option>
<option>First</option><option>Second</option>
<option>Third</option><option>Fourth</option>
</select>
<button type="submit">Register</button>
<p id="message" role="status"></p>
</form>
</section>
</main>
<footer><p>&copy; 2026 Student Information Portal</p></footer>
<script>
const form = document.getElementById("registrationForm");
const rows = document.getElementById("studentRows");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const roll = document.getElementById("roll").value.trim();
  const department = document.getElementById("department").value;
  const year = document.getElementById("year").value;

  const exists = Array.from(rows.rows).some(row =>
    row.cells[0].textContent.toLowerCase() === roll.toLowerCase()
  );
  if (exists) {
    message.textContent = "Roll number already exists.";
    return;
  }

  const row = rows.insertRow();
  [roll, name, department, year].forEach(value => {
    row.insertCell().textContent = value;
  });
  message.textContent = "Student registered successfully.";
  form.reset();
});
</script>
</body>
</html>
