<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NDARBA | Admin Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding-top:76px; font-family:Segoe UI,Arial,sans-serif; color:#212529; background:#f3f6fb; display:flex; flex-direction:column; }
    .navbar-custom { background:linear-gradient(100deg,#2864f1,#fff,#ec0b26); box-shadow:0 3px 12px #00000018; }
    .brand { font-weight:800; letter-spacing:.08em; color:#111; text-decoration:none; display:flex; align-items:center; gap:10px; }
    .brand-mark { width:38px;height:38px;border-radius:8px;background:#fff;display:grid;place-items:center;border:2px solid #111;font-weight:900; }
    .nav-link { color:#111!important;font-weight:600; }
    main { flex:1; display:grid; place-items:center; padding:30px 16px 45px; }
    .login-card { width:min(100%,410px); background:white; border-radius:18px; padding:32px; box-shadow:0 16px 45px #16335c18; border:1px solid #e5eaf2; }
    .eyebrow { color:#2864f1; font-weight:800; letter-spacing:.12em; font-size:.75rem; text-transform:uppercase; }
    h1 { font-size:1.8rem;font-weight:800;margin:.4rem 0 .35rem; }
    .form-label { font-weight:650;margin-top:15px; }
    .form-control { padding:.75rem .85rem; }
    .btn-login { background:#2864f1;color:#fff;font-weight:700;padding:.8rem;border:0; }
    .btn-login:hover { background:#194fd0;color:#fff; }
    #errorMessage { min-height:24px;margin:12px 0 0;color:#b42318;font-size:.92rem; }
    footer { background:linear-gradient(100deg,#2864f1,#fff,#ec0b26);padding:18px;text-align:center;font-size:.9rem; }
    body.dark { background:#111827;color:#e5e7eb; }
    body.dark .login-card { background:#1f2937;border-color:#374151;color:#f3f4f6; }
    body.dark .form-control { background:#111827;color:#fff;border-color:#4b5563; }
    body.dark .text-secondary { color:#cbd5e1!important; }
    @media(max-width:480px) { .login-card { padding:24px 20px; } }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
      <a class="brand" href="/"><span class="brand-mark">N</span><span>NDARBA</span></a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a class="nav-link d-none d-sm-inline" href="https://rollballindia.org/" target="_blank" rel="noopener">RBFI</a>
        <a class="nav-link d-none d-sm-inline" href="https://maharashtrarollball.org/" target="_blank" rel="noopener">MRBA</a>
        <button id="theme-toggle" class="btn btn-sm btn-outline-dark" type="button" aria-label="Toggle theme">🌙</button>
      </div>
    </div>
  </nav>

  <main>
    <section class="login-card" aria-labelledby="loginHeading">
      <div class="eyebrow">Secure access</div>
      <h1 id="loginHeading">Admin Login</h1>
      <p class="text-secondary mb-3">Sign in with your administrator username and password.</p>
      <form id="loginForm">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required maxlength="40">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me for 7 days</label>
        </div>
        <button class="btn btn-login w-100 mt-4" id="loginButton" type="submit">Login</button>
        <p id="errorMessage" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>© <span id="year"></span> Rollball Nashik · NDARBA</footer>
  <script>
    const form = document.getElementById("loginForm");
    const errorMessage = document.getElementById("errorMessage");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorMessage.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in…";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
            rememberMe: document.getElementById("rememberMe").checked
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Login failed. Please try again.");
        window.location.assign(data.redirect || "/admin.html");
      } catch (error) {
        errorMessage.textContent = error.message || "Could not connect to the server.";
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    document.getElementById("year").textContent = new Date().getFullYear();
    const themeToggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("ndarba-theme") || "light";
    if (savedTheme === "dark") document.body.classList.add("dark");
    themeToggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
    themeToggle.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const theme = document.body.classList.contains("dark") ? "dark" : "light";
      localStorage.setItem("ndarba-theme", theme);
      themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    });
  </script>
</body>
</html>
